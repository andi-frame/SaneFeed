name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release runs the same checks before it builds.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Type check
        run: bunx -p typescript@5 tsc --noEmit -p .

  ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # v5: v6 moved caching into a proprietary component with separate terms.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint and build (unsigned release)
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
