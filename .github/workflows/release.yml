name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the previous tag

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be at most 99 to fit versionCode"
            exit 1
          fi
          {
            echo "name=$version"
            echo "code=$(( major * 10000 + minor * 100 + patch ))"
            echo "prerelease=$([[ -n "${BASH_REMATCH[4]}" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        env:
          SANEFEED_KEYSTORE_BASE64: ${{ secrets.SANEFEED_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$SANEFEED_KEYSTORE_BASE64" ]]; then
            echo "::error::Secret SANEFEED_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$SANEFEED_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SANEFEED_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          SANEFEED_KEYSTORE_PASSWORD: ${{ secrets.SANEFEED_KEYSTORE_PASSWORD }}
          SANEFEED_KEY_ALIAS: ${{ secrets.SANEFEED_KEY_ALIAS }}
          SANEFEED_KEY_PASSWORD: ${{ secrets.SANEFEED_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease :app:bundleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify signature and collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/SaneFeed-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/SaneFeed-$VERSION.aab"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/dist/SaneFeed-$VERSION.apk"
          jarsigner -verify "$RUNNER_TEMP/dist/SaneFeed-$VERSION.aab" | grep "jar verified"
          cd "$RUNNER_TEMP/dist"
          sha256sum "SaneFeed-$VERSION.apk" "SaneFeed-$VERSION.aab" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          range="${previous:+$previous..}$TAG"
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
            echo
            echo "Install \`SaneFeed-${TAG#v}.apk\` on Android; see the README for setup. Check the download against \`SHA256SUMS.txt\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "SaneFeed $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" \
            "$RUNNER_TEMP/dist/SaneFeed-$VERSION.apk" \
            "$RUNNER_TEMP/dist/SaneFeed-$VERSION.aab" \
            "$RUNNER_TEMP/dist/SHA256SUMS.txt"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
